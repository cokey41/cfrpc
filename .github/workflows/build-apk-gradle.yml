name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        working-directory: client
        run: npm install

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          # Create symlink for node_modules since Metro looks in project root
          cd ../../
          ln -s client/node_modules node_modules || true
          ls -la
          cd client/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        working-directory: client
        run: |
          find . -name "*.apk" -type f | head -1 > apk_path.txt
          echo "APK path: $(cat apk_path.txt)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frpc-app-apk
          path: client/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
